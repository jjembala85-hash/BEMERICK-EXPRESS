<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <title>BX News link-preview template 1200x630 (draft)</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082A30" stop-opacity="0.05"/>
      <stop offset="0.45" stop-color="#082A30" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#082A30" stop-opacity="0.97"/>
    </linearGradient>
  </defs>
  <!-- PHOTO PLACEHOLDER: replaced by the article lead image -->
  <rect width="1200" height="630" fill="#5B6670"/>
  <text x="600" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#E4ECEA" opacity="0.6">[ lead photo, full bleed ]</text>
  <rect width="1200" height="630" fill="url(#fade)"/>
  <!-- Gold express slash -->
  <path d="M1200 0 L1200 140 L1060 0 Z" fill="#D9A441"/>
  <!-- Kicker -->
  <rect x="64" y="300" width="6" height="28" fill="#D9A441"/>
  <text x="84" y="322" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="24" letter-spacing="3" fill="#D9A441">BUSINESS</text>
  <!-- Headline (max 3 lines) -->
  <text font-family="Newsreader, Georgia, serif" font-weight="700" font-size="56" fill="#FFFFFF">
    <tspan x="64" y="392">Headline goes here in up to three</tspan>
    <tspan x="64" y="456">lines, automatically sized to fit</tspan>
    <tspan x="64" y="520">the card</tspan>
  </text>
  <!-- Brand bar -->
  <rect x="0" y="560" width="1200" height="70" fill="#0E3B43"/>
  <g transform="translate(64 571) scale(0.75)">
    <rect width="64" height="64" rx="12" fill="#FAF7F2"/>
    <rect x="10" y="16" width="6" height="33" fill="#0E3B43"/>
    <path d="M13 19 h9 a6.5 6.5 0 0 1 0 13 h-9 M13 32 h10 a7 7 0 0 1 0 14 h-10" fill="none" stroke="#0E3B43" stroke-width="6"/>
    <path d="M38 17 L54 47" stroke="#0E3B43" stroke-width="6" stroke-linecap="square"/>
    <path d="M54 17 L38 47" stroke="#D9A441" stroke-width="6" stroke-linecap="square"/>
  </g>
  <text x="128" y="604" font-family="Newsreader, Georgia, serif" font-weight="700" font-size="26" fill="#FFFFFF" letter-spacing="1">BEMERICK EXPRESS</text>
  <text x="1136" y="604" text-anchor="end" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="22" fill="#E4ECEA">bemerickexpress.com</text>
  <text x="1188" y="548" text-anchor="end" font-family="Arial, sans-serif" font-size="14" fill="#E4ECEA" opacity="0.8">Photo: Credit Name</text>
</svg>
