<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <title>BX News breaking card 1080x1080 (WhatsApp Channel, X) (draft)</title>
  <rect width="1080" height="1080" fill="#0E3B43"/>
  <!-- Ember band -->
  <rect width="1080" height="180" fill="#C8401F"/>
  <circle cx="98" cy="90" r="18" fill="#FFFFFF"/>
  <circle cx="98" cy="90" r="30" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="4"/>
  <text x="150" y="112" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="64" letter-spacing="10" fill="#FFFFFF">BREAKING</text>
  <!-- Gold express slash -->
  <path d="M1080 180 L1080 360 L900 180 Z" fill="#D9A441"/>
  <!-- Headline -->
  <text font-family="Newsreader, Georgia, serif" font-weight="700" font-size="80" fill="#FFFFFF">
    <tspan x="80" y="420">Breaking headline</tspan>
    <tspan x="80" y="516">in plain words,</tspan>
    <tspan x="80" y="612">maximum four</tspan>
    <tspan x="80" y="708">lines</tspan>
  </text>
  <text x="80" y="800" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="34" fill="#E4ECEA">More to follow · Updated 14:05 EAT</text>
  <!-- Footer -->
  <rect x="0" y="940" width="1080" height="140" fill="#082A30"/>
  <g transform="translate(80 966) scale(1.4)">
    <rect width="64" height="64" rx="12" fill="#FAF7F2"/>
    <rect x="10" y="16" width="6" height="33" fill="#0E3B43"/>
    <path d="M13 19 h9 a6.5 6.5 0 0 1 0 13 h-9 M13 32 h10 a7 7 0 0 1 0 14 h-10" fill="none" stroke="#0E3B43" stroke-width="6"/>
    <path d="M38 17 L54 47" stroke="#0E3B43" stroke-width="6" stroke-linecap="square"/>
    <path d="M54 17 L38 47" stroke="#D9A441" stroke-width="6" stroke-linecap="square"/>
  </g>
  <text x="192" y="1024" font-family="Newsreader, Georgia, serif" font-weight="700" font-size="40" fill="#FFFFFF" letter-spacing="1">BEMERICK EXPRESS</text>
  <text x="1000" y="1024" text-anchor="end" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="30" fill="#D9A441">bemerickexpress.com</text>
</svg>
