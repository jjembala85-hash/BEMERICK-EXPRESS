<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <title>BX News vertical story template 1080x1920 (WhatsApp Status, TikTok cover) (draft)</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#082A30" stop-opacity="0.35"/>
      <stop offset="0.4" stop-color="#082A30" stop-opacity="0.1"/>
      <stop offset="0.7" stop-color="#082A30" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#082A30" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1920" fill="#5B6670"/>
  <text x="540" y="700" text-anchor="middle" font-family="Arial, sans-serif" font-size="40" fill="#E4ECEA" opacity="0.6">[ photo or anchor still ]</text>
  <rect width="1080" height="1920" fill="url(#fade)"/>
  <!-- Top brand (kept clear of platform UI: top 250px safe zone) -->
  <g transform="translate(80 260) scale(1.5)">
    <rect width="64" height="64" rx="12" fill="#0E3B43"/>
    <rect x="10" y="16" width="6" height="33" fill="#FAF7F2"/>
    <path d="M13 19 h9 a6.5 6.5 0 0 1 0 13 h-9 M13 32 h10 a7 7 0 0 1 0 14 h-10" fill="none" stroke="#FAF7F2" stroke-width="6"/>
    <path d="M38 17 L54 47" stroke="#FAF7F2" stroke-width="6" stroke-linecap="square"/>
    <path d="M54 17 L38 47" stroke="#D9A441" stroke-width="6" stroke-linecap="square"/>
  </g>
  <text x="200" y="320" font-family="Newsreader, Georgia, serif" font-weight="700" font-size="40" fill="#FFFFFF" letter-spacing="1">BX NEWS</text>
  <!-- Kicker + headline in the middle-lower zone (bottom 340px kept clear for TikTok captions/buttons) -->
  <rect x="80" y="1130" width="8" height="40" fill="#D9A441"/>
  <text x="104" y="1162" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-weight="600" font-size="34" letter-spacing="4" fill="#D9A441">UGANDA</text>
  <text font-family="Newsreader, Georgia, serif" font-weight="700" font-size="76" fill="#FFFFFF">
    <tspan x="80" y="1260">Headline across</tspan>
    <tspan x="80" y="1348">up to four short</tspan>
    <tspan x="80" y="1436">lines for vertical</tspan>
    <tspan x="80" y="1524">screens</tspan>
  </text>
  <rect x="80" y="1560" width="200" height="4" fill="#D9A441"/>
  <text x="80" y="1610" font-family="'Instrument Sans', 'Segoe UI', Arial, sans-serif" font-size="32" fill="#E4ECEA">Full story: bemerickexpress.com</text>
</svg>
